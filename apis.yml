apis:
- aid: qualys:vmdr-api
  name: Qualys VMDR API
  description: REST/XML API for managing the full Vulnerability Management Detection
    and Response lifecycle including asset inventory, scans, vulnerability findings,
    prioritization, and reports. Base URL varies per pod (US Platform 1 uses qualysapi.qualys.com);
    authentication is HTTP Basic with Qualys account credentials.
  humanURL: https://docs.qualys.com/en/vm/api/
  baseURL: https://qualysapi.qualys.com
  tags:
  - Vulnerability Management
  - Asset Inventory
  - Scans
  - Reports
  properties:
  - type: Documentation
    url: https://docs.qualys.com/en/vm/api/
  - type: API Quick Reference
    url: https://cdn2.qualys.com/docs/qualys-api-quick-reference.pdf
  - type: User Guide
    url: https://cdn2.qualys.com/docs/qualys-api-vmpc-user-guide.pdf
  - type: Pod URLs
    url: https://www.qualys.com/platform-identification/
  - url: graphql/qualys-graphql.md
    type: GraphQL
- aid: qualys:authentication-api
  name: Qualys Authentication API
  description: Authentication endpoint that issues JSON Web Tokens (JWT) used as Bearer
    credentials for newer Qualys APIs (VMDR OT, CSAM, TotalCloud). Clients post username
    and password to /auth and pass the returned token in the Authorization header
    on subsequent requests.
  humanURL: https://docs.qualys.com/en/vmdr-ot/api/vmdrot_api/ch01/get_started.htm
  baseURL: https://gateway.qg1.apps.qualys.com
  tags:
