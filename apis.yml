aid: qualys
name: Qualys
description: Qualys is a cloud-based security and compliance platform offering Vulnerability
  Management Detection and Response (VMDR), Policy Compliance, Web Application Scanning,
  Container Security, EDR, and Cloud Security Posture Management. The Qualys API framework
  exposes XML and JSON REST endpoints across platform pods (qualysapi.qualys.com,
  qualysapi.qg2.apps.qualys.com, etc.) for managing scans, assets, vulnerabilities,
  reports, and findings. Authentication supports HTTP Basic auth and JWT bearer tokens
  via the Qualys Authentication API.
type: Index
